---
# Catalogo dos 4 perfis. Sao MODELOS: nunca criados com este nome. Para cada
# Team (area) e criada uma copia com o nome do Team no lugar de "Custom"
# (roles/rbac/tasks/area_roles.yml), ex.: "Linux - Auditor".
#
# As roles sao de Organization (content_type shared.organization): sao
# vinculadas ao usuario na Organization do Team, sem escolher objeto, e
# valem para TODOS os objetos da Organization (inclusive os criados
# depois). Para isolar areas, use Organizations diferentes.
#
#   Perfil         Credential   Inventory    Project      JobTemplate  Workflow
#   Administrator  full         full         full         full         full
#   Operator       read/upd/ex  read/upd/ex  read/upd/ex  read/upd/ex  read/upd/ex
#   Developer      read/ex      read/ex      read/upd/ex  read/upd/ex  read/upd/ex
#   Auditor        read         read         read         read         read
#
# read = view, update = change, execute = use (Credential/Inventory/Project)
# ou execute (JobTemplate/Workflow). Administrator = mesmas permissoes das
# roles nativas "Organization {Recurso} Admin".
rbac_roles:
  - name: Custom - Administrator
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.add_credential
      - awx.view_credential
      - awx.change_credential
      - awx.use_credential
      - awx.delete_credential
      - awx.add_inventory
      - awx.view_inventory
      - awx.change_inventory
      - awx.use_inventory
      - awx.adhoc_inventory
      - awx.update_inventory
      - awx.delete_inventory
      - awx.add_project
      - awx.view_project
      - awx.change_project
      - awx.use_project
      - awx.update_project
      - awx.delete_project
      - awx.view_jobtemplate
      - awx.change_jobtemplate
      - awx.execute_jobtemplate
      - awx.delete_jobtemplate
      - awx.add_workflowjobtemplate
      - awx.view_workflowjobtemplate
      - awx.change_workflowjobtemplate
      - awx.execute_workflowjobtemplate
      - awx.approve_workflowjobtemplate
      - awx.delete_workflowjobtemplate

  - name: Custom - Operator
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.view_credential
      - awx.change_credential
      - awx.use_credential
      - awx.view_inventory
      - awx.change_inventory
      - awx.use_inventory
      - awx.view_project
      - awx.change_project
      - awx.use_project
      - awx.view_jobtemplate
      - awx.change_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_workflowjobtemplate
      - awx.change_workflowjobtemplate
      - awx.execute_workflowjobtemplate

  - name: Custom - Developer
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.view_credential
      - awx.use_credential
      - awx.view_inventory
      - awx.use_inventory
      - awx.view_project
      - awx.change_project
      - awx.use_project
      - awx.view_jobtemplate
      - awx.change_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_workflowjobtemplate
      - awx.change_workflowjobtemplate
      - awx.execute_workflowjobtemplate

  - name: Custom - Auditor
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.view_credential
      - awx.view_inventory
      - awx.view_project
      - awx.view_jobtemplate
      - awx.view_workflowjobtemplate
